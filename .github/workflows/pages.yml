# Сайт фотографа (landing/) на GitHub Pages — бесплатно, без сервера.
# Сборка в демо-режиме: запись отправляет готовый текст заявки в Telegram, админки нет.
# Запускается при изменениях в landing/ на ветке main или вручную (Actions → Run workflow).
name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      # Относительные пути (--base ./): сайт работает и на своём домене, и по адресу <user>.github.io/<repo>/
      - run: npm run build -- --base ./
        env:
          VITE_DEMO: '1'
          VITE_SITE_URL: https://vaag-ph.duckdns.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
