# Сайт фотографа (landing/) на GitHub Pages — бесплатно, без сервера.
# Сборка в демо-режиме: запись отправляет готовый текст заявки в Telegram, админки нет.
# Собранный сайт кладётся в ветку gh-pages — из неё GitHub Pages и показывает сайт.
# Запускается при изменениях в landing/ на ветке main или вручную (Actions → Run workflow).
name: Сайт на GitHub Pages

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      # Относительные пути (--base ./): сайт работает и на своём домене, и по адресу <user>.github.io/<repo>/
      - run: npm run build -- --base ./
        env:
          VITE_DEMO: '1'
          VITE_SITE_URL: https://vaag-ph.duckdns.org
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: landing/dist
          publish_branch: gh-pages
          # Свой домен (DuckDNS указывает на GitHub Pages 185.199.108.153)
          cname: vaag-ph.duckdns.org
