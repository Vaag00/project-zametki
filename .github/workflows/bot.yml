# Бот Telegram и запись на съёмку (landing/worker) в Cloudflare: Worker + база D1. Бесплатно.
# В первый раз сам создаёт базу, потом только обновляет код. Заявки при обновлении сохраняются.
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN — см. landing/worker/README.md.
# После развёртывания пересобирает сайт, чтобы запись на сайте шла через бота.
name: Бот в Cloudflare

on:
  push:
    branches: [main]
    paths: ['landing/worker/**', 'landing/shared/**', 'landing/server/app/seed.json', '.github/workflows/bot.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Проверить секреты
        working-directory: .
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Settings → Secrets and variables → Actions, инструкция — landing/worker/README.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/worker/package-lock.json
      - run: npm ci
      - name: Проверки
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Развернуть
        run: deploy/deploy.sh
      - name: Пересобрать сайт
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
