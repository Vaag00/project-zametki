# Бот Telegram и запись на съёмку (landing/bot) в Яндекс Облаке: функция Cloud Functions + база YDB.
# В первый раз сам создаёт базу и функцию, потом только обновляет код. Данные при обновлении сохраняются.
# Нужны секреты репозитория: YC_SA_KEY (ключ сервисного аккаунта) и TELEGRAM_BOT_TOKEN — см. landing/bot/README.md.
# После развёртывания пересобирает сайт, чтобы запись на сайте шла через бота.
name: Бот в Яндекс Облаке

on:
  push:
    branches: [main]
    paths: ['landing/bot/**', 'landing/server/app/seed.json', '.github/workflows/bot.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SITE_URL: https://vaag-ph.duckdns.org
      OWNER_USERNAME: vaaaaaag
    steps:
      - name: Проверить секреты
        run: |
          missing=""
          [ -n "$YC_SA_KEY" ] || missing="$missing YC_SA_KEY"
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Settings → Secrets and variables → Actions, инструкция — landing/bot/README.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Тесты
        working-directory: landing/bot
        run: |
          pip install -q pytest
          python -m pytest -q tests
      - name: Вход в Яндекс Облако
        run: landing/bot/deploy/yc_login.sh
      - name: Развернуть
        run: landing/bot/deploy/deploy.sh
      - name: Пересобрать сайт
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
