name = "vaag-booking"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
# С каких адресов сайт может обращаться к серверу (через запятую).
ALLOWED_ORIGINS = "https://vaag-ph.ru,https://www.vaag-ph.ru,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "vaag-booking"
# Вставьте сюда id из вывода `npx wrangler d1 create vaag-booking`
database_id = "00000000-0000-0000-0000-000000000000"

# Секреты задаются командами, а не здесь:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
